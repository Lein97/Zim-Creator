name: Descargar y Crear ZIM

on:
  workflow_dispatch:
  push:
    paths:
      - 'url.txt'
      - 'icon.png'

jobs:
  download-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Instalar herramientas necesarias
      run: |
        sudo apt-get update
        sudo apt-get install -y wget zim-tools python3 zip

    - name: Leer URLs desde archivo
      id: read_urls
      run: |
        if [ -f "url.txt" ]; then
          URL_COUNT=$(grep -c '^https\?://' url.txt || echo "0")
          echo "Número de URLs encontradas: $URL_COUNT"
          echo "url_count=$URL_COUNT" >> $GITHUB_OUTPUT
          
          echo "📋 URLs a descargar:"
          grep '^https\?://' url.txt || echo "No se encontraron URLs válidas"
        else
          echo "❌ Error: No se encontró el archivo url.txt"
          exit 1
        fi

    - name: Descargar páginas web
      run: |
        mkdir -p downloaded-site
        cd downloaded-site
        
        while IFS= read -r url; do
          if [[ $url =~ ^https?:// ]]; then
            echo "⬇️ Descargando: $url"
            wget --no-check-certificate --mirror --convert-links --no-parent --page-requisites --no-verbose "$url" || echo "⚠️ Error descargando: $url"
          fi
        done < ../url.txt

    - name: Generar archivo ZIM
      run: |
        echo "📦 Creando archivo ZIM..."
        
        # Verificar si el icono existe en la raíz del repositorio
        ICON_PATH=""
        if [ -f "icon.png" ]; then
          ICON_PATH="icon.png"
          echo "🎨 Archivo icon.png encontrado en la raíz."
        else
          echo "⚠️ Advertencia: No se encontró icon.png en la raíz. Se continuará sin ilustración."
        fi

        cd downloaded-site
        
        # Búsqueda inteligente del archivo principal de bienvenida
        WELCOME_FILE=""
        
        # 1. Buscar si existe explícitamente un welcome.html
        if [ -n "$(find . -name "welcome.html" -print -quit)" ]; then
          WELCOME_FILE=$(find . -name "welcome.html" -print -quit | sed 's|^\./||')
        # 2. Buscar si existe un index.html
        elif [ -n "$(find . -name "index.html" -print -quit)" ]; then
          WELCOME_FILE=$(find . -name "index.html" -print -quit | sed 's|^\./||')
        # 3. Buscar un archivo que contenga 'index' o 'main'
        elif [ -n "$(find . -iname "*index*.html" -print -quit)" ]; then
          WELCOME_FILE=$(find . -iname "*index*.html" -print -quit | sed 's|^\./||')
        # 4. Si no encuentra ninguno de los anteriores, toma el primer html disponible que no sea un recurso secundario menor
        else
          WELCOME_FILE=$(find . -name "*.html" | head -n 1 | sed 's|^\./||')
        fi
        
        if [ -z "$WELCOME_FILE" ]; then
          echo "⚠️ Advertencia: No se encontró ningún archivo HTML, se omite la creación del ZIM."
        else
          echo "📄 Archivo de bienvenida seleccionado inteligentemente: $WELCOME_FILE"
          
          # Construir el comando de zimwriterfs con descripciones válidas
          ZIM_ARGS=(
            --welcome="$WELCOME_FILE"
            --language=spa
            --title="Coleccion Offline ZIM"
            --description="Coleccion de guias offline"
            --longDescription="Coleccion completa de paginas y guias descargadas para consulta offline, generada automaticamente desde GitHub Actions."
            --creator="Lein"
            --publisher="GitHub Actions"
            --name="guia-offline-nintendo"
          )
          
          if [ -n "$ICON_PATH" ] && [ -f "../$ICON_PATH" ]; then
            ZIM_ARGS+=(--illustration="../$ICON_PATH")
          fi
          
          # Ejecutamos zimwriterfs
          zimwriterfs "${ZIM_ARGS[@]}" . ../sitio-generado.zim
          
          echo "✅ Archivo ZIM creado con éxito."
        fi

    - name: Comprimir resultados (ZIP)
      run: |
        zip -r website-content.zip downloaded-site/ -x "*/.*" 2>/dev/null || true

    - name: Verificar resultados
      run: |
        if [ -f website-content.zip ]; then
          echo "✅ ZIP creado exitosamente"
          echo "📦 Tamaño ZIP: $(du -h website-content.zip | cut -f1)"
        fi
        if [ -f sitio-generado.zim ]; then
          echo "✅ ZIM creado exitosamente"
          echo "📦 Tamaño ZIM: $(du -h sitio-generado.zim | cut -f1)"
        fi

    - name: Subir artifacts
      uses: actions/upload-artifact@v4
      with:
        name: contenido-offline-zim
        path: |
          website-content.zip
          sitio-generado.zim
        retention-days: 30

