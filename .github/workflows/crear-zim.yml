name: Generar ZIM Dinámico Universal

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar herramientas necesarias
        run: |
          sudo apt-get update
          sudo apt-get install -y wget zim-tools python3

      - name: Leer URL y descargar con Wget
        run: |
          TARGET_URL=$(cat url.txt | tr -d '\r')
          echo "Descargando URL: $TARGET_URL"
          
          # Descarga recursiva universal
          wget --recursive --level=inf --convert-links --adjust-extension \
               --page-requisites --no-parent --no-clobber \
               --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
               "$TARGET_URL"

      - name: Detectar bienvenida y empaquetar en ZIM
        run: |
          DOMAIN=$(python3 -c "from urllib.parse import urlparse; print(urlparse('$(cat url.txt | tr -d '\r')').netloc)")
          echo "Directorio detectado: $DOMAIN"
          
          cd "$DOMAIN"
          
          # Buscamos automáticamente un archivo de bienvenida común (index.html, welcome.html, main.html, etc.)
          WELCOME_FILE=""
          for file in index.html welcome.html home.html default.html; do
            if [ -f "$file" ]; then
              WELCOME_FILE="$file"
              break
            fi
          done
          
          # Si no está en la raíz, buscamos cualquier archivo .html principal o el primero que encuentre
          if [ -z "$WELCOME_FILE" ]; then
            WELCOME_FILE=$(find . -maxdepth 3 -name "*.html" | head -n 1 | sed 's|^\./||')
          fi
          
          echo "Archivo de bienvenida detectado: $WELCOME_FILE"
          
          if [ -z "$WELCOME_FILE" ]; then
            echo "Error: No se encontró ningún archivo HTML principal para el ZIM."
            exit 1
          fi
          
          # Empaquetamos usando los datos detectados de forma genérica
          zimwriterfs --welcome="$WELCOME_FILE" \
                      --language=spa \
                      --title="Documentacion Offline" \
                      --description="Archivo ZIM generado automaticamente desde GitHub Actions" \
                      . \
                      ../archivo-salida.zim

      - name: Subir el archivo ZIM resultante
        uses: actions/upload-artifact@v4
        with:
          name: archivo-zim-generado
          path: archivo-salida.zim
